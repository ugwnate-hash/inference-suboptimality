# Experiment settings, read by every script via `--config config.yaml`.
# Flags given on the command line override these values.
# A script ignores keys it doesn't use (e.g. local_ffg.py has no `epochs`).
# Action flags (--train, --eval-iwae, --eval-ais) and paths to checkpoints stay
# on the command line; the Kaggle notebook passes them for each step.

dataset: mnist             # mnist | fashion | cifar

model:
  z_size: 2
  wide_encoder: false      # more hidden units / channels in the encoder
  has_flow: false          # normalizing flow on top of the Gaussian encoder
  hamiltonian_flow: false  # Hamiltonian flow (run.py and bdmc.py only)
  n_flows: 2

train:
  epochs: 3280
  batch_size: 100
  display_epoch: 10        # evaluate + save a checkpoint every N epochs
  lr_schedule: true        # IWAE learning-rate decay
  warmup: true             # anneal the KL term in over the first epochs
  early_stopping: true
  encoder_more: false      # extra encoder updates per step

eval:
  # Paper settings: n_iwae 5000, n_ais_dist 10000, n_ais_iwae 100.
  # These smaller values keep each evaluation to a reasonable time.
  n_iwae: 1000
  n_ais_dist: 1000
  n_ais_iwae: 16
  ais_schedule: linear     # linear | sigmoid
  n_batch: 1               # batches of simulated data for bdmc.py
